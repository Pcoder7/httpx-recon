name: Parallel HTTPX Probe

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  
  MAX_PARALLEL: 20         # <— throttle HTTPX jobs

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
      unique_domains: ${{ steps.set_matrix.outputs.unique_domains }}
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0 

      - name: Build domain matrix from results/*/all_resolved.txt
        id: set_matrix
        run: |
          # 1. Discover domain folders with all_resolved.txt
          mapfile -t domains < <(
            find results -mindepth 1 -maxdepth 1 -type d \
              -exec test -f "{}/all_resolved.txt" \; -print \
            | sed 's|results/||'
          )
      
          # 2. If no domains are found, emit an empty matrix
          if [ ${#domains[@]} -eq 0 ]; then
            echo "No domains found under results/ — emitting empty matrix."
            echo "matrix<<EOF" >> $GITHUB_OUTPUT
            echo "[]"           >> $GITHUB_OUTPUT
            echo "EOF"          >> $GITHUB_OUTPUT
          else
            pairs=()
      
            for d in "${domains[@]}"; do
              SRC="results/$d/all_resolved.txt"

              # skip if file somehow missing  
              [ -f "$SRC" ] || continue
              
              # ← step A: get the total line count
              LINES=$(wc -l < "$SRC")
              echo "Source $SRC has $LINES lines"
      
              # 3. Create per-domain chunk dir & split into 100-line files
              CHUNK_DIR="results/$d/chunks"
              mkdir -p "$CHUNK_DIR"
              if [ "$LINES" -ge 1000 ]; then
                echo "— ≥1 000 lines: splitting into 30 equal chunks"
                split -n l/30 \
                      --numeric-suffixes=1 --suffix-length=2 --additional-suffix=.txt \
                      "$SRC" "$CHUNK_DIR/chunk_"
              elif [ "$LINES" -gt 200 ]; then
                echo "— > 200 lines: splitting into 20 equal chunks"
                split -n l/8 \
                      --numeric-suffixes=1 --suffix-length=2 --additional-suffix=.txt \
                      "$SRC" "$CHUNK_DIR/chunk_"
              else
                echo "— ≤ 50 lines: splitting into 50-line chunks"
                split -l 50 \
                      --numeric-suffixes=1 --suffix-length=2 --additional-suffix=.txt \
                      "$SRC" "$CHUNK_DIR/chunk_"
              fi          
      
              # 4. Debug: list out what we just created
              echo "Contents of $CHUNK_DIR:"
              ls -R "$CHUNK_DIR" || echo "(none found)"
      
              # 5. Build a JSON pair for each chunk file
              for CH in "$CHUNK_DIR"/chunk_*; do
                pairs+=( "{\"domain\":\"$d\",\"chunk\":\"$CH\"}" )
              done
            done
      
            # 6. Emit the chunk-level matrix
            echo "matrix<<EOF" >> $GITHUB_OUTPUT
            printf '%s\n' "${pairs[@]}" | jq -s . >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      
          # 7. Emit the unique domain list (unchanged)
          domains_json=$(printf '%s\n' "${domains[@]}" | jq -R . | jq -s .)
          {
            echo "unique_domains<<EOF"
            echo "${domains_json}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"    
                

      - name: Upload chunks artifact
        uses: actions/upload-artifact@v4
        with:
          name: httpx-chunks
          path: results/*/chunks/**
  
  httpx:
    needs: prepare_matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pcoder7/spider-puredns-actions:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}       
    if: ${{ needs.prepare_matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}
      max-parallel: 20

    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0     
          
      - name: Ensure httpx & anew are installed
        run: |
         
          if ! command -v httpx >/dev/null; then
            echo "httpx installed"
                
          else
            echo "httpx already installed"
          fi
          if ! command -v anew >/dev/null; then
            go install -v github.com/tomnomnom/anew@latest
            
          else
            echo "anew already installed"
          fi

      - name: Install Go and Gbounty scanner
        run: |
          # The ubuntu-latest runner has Go. If not, you would add an installation step here.
          echo "Installing Gbounty..."
          go install -v github.com/BountySecurity/gbounty/cmd/gbounty@main
  
                
      - name: Download chunk files
        uses: actions/download-artifact@v4
        with: 
          name: httpx-chunks 
          path: results/
     
      - name: Probe with Gbounty on ${{ matrix.pair.domain }}
        shell: bash
        run: |          D="${{ matrix.pair.domain }}"
          CH="${{ matrix.pair.chunk }}"
          OUT="results/${D}/httpx_out"
          mkdir -p "$OUT"

          # ==================== THE FIX IS HERE ====================
          # Define the SINGLE, CORRECT output file path without any extension.
          # e.g., results/domain/httpx_out/httpx_chunk_01
          OUTPUT_FILE_PATH="${OUT}/httpx_$(basename "$CH" .txt)"
          # =========================================================

          echo "▶ Processing $CH with Gbounty for JSON output"
          echo "  - Gbounty will write to: ${OUTPUT_FILE_PATH}"
          echo "  - This script will check for: ${OUTPUT_FILE_PATH}"
          
          # Run the command, telling it to create the file with the exact name.
          gbounty --urls-file "$CH" -silent -c 10 -r 10 -p SQLi_StatusCode.bb2 --json -o "$OUTPUT_FILE_PATH"
          
          echo "Gbounty scan finished."

          # This check now looks for the correct extension-less filename.
          if [ -f "$OUTPUT_FILE_PATH" ]; then
            echo "SUCCESS: Output file '$OUTPUT_FILE_PATH' was created by Gbounty."
            ls -l "$OUTPUT_FILE_PATH"
          else
            echo "::warning:: Gbounty did not create an output file. Creating an empty one."
            touch "$OUTPUT_FILE_PATH"
          fi

          # =========================================================
            
      - name: Compute artifact details
        id: art_details
        run: |
          DOMAIN="${{ matrix.pair.domain }}"
          CHUNK_FILE_PATH="${{ matrix.pair.chunk }}"
          # Get basename without extension, e.g., "chunk_01"
          CHUNK_BASENAME_NO_EXT=$(basename "${CHUNK_FILE_PATH}" .txt)
          
          # ==================== THE FIX IS HERE ====================
          # The artifact name and upload path must NOT have an extension.
          
          # e.g., "httpx-domain-chunk_01"
          ARTIFACT_NAME="httpx-${DOMAIN}-${CHUNK_BASENAME_NO_EXT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          
          # e.g., "results/domain/httpx_out/httpx_chunk_01"
          FILE_TO_UPLOAD_PATH="results/${DOMAIN}/httpx_out/httpx_${CHUNK_BASENAME_NO_EXT}"
          echo "file_to_upload=${FILE_TO_UPLOAD_PATH}" >> $GITHUB_OUTPUT

          
      - name: Upload per‑chunk Gbounty results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art_details.outputs.artifact_name }}
          path: ${{ steps.art_details.outputs.file_to_upload }}
          if-no-files-found: error 
  
